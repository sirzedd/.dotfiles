# Tmux Configuration
# Generated with TmuxAI Config Generator
# https://tmuxai.dev

# Start with current shell
set-option -g default-shell $SHELL
# Start with current path variables
set-environment -g PATH "$PATH"


# Visual settings for nvim images plugin
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

# -- Basic Settings ------------------------------------------

# set-option -g default-shell $SHELL
# set-environment -g PATH "$PATH"
# 
# set -ga terminal-overrides ",xterm-256color*:Tc"
# set -s escape-time 0

#  enable clipboard integration
# set -g set-clipboard on

#  For tmux 3.2 or newer
# set -g copy-command 'pbcopy'
set -g prefix C-a
set -s escape-time 0
set -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on


# don't rename windows automatically
set-option -g allow-rename off

#---------Window -------------
set -g pane-border-format " █ "
set -g pane-active-border-style "fg=brightblue"
set -g pane-border-style "fg=colour238"
#set -g window-status-current-format " 🔥 #I:#W "

# Tint active pane background slightly
set -g window-style 'bg=colour235'
set -g window-active-style 'bg=colour237'
#set -g pane-border-style "fg=colour238"
#set -g pane-active-border-style "fg=colour226,bold"
#set -g pane-active-border-format " █ "
#set -g pane-border-format "   "
# -- Key Bindings ------------------------------------------

# Pane management
bind v split-window -h
bind h split-window -v


## -----------------------------Tmux Copy
## Copy Mode in TMUX
bind -n C-Space copy-mode
## For copy mode use vi keys
setw -g mode-keys vi
## Copy mode behave like Vim visual mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
## Mouse copy automatically
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
## ---------/Tmux Copy


# Bookmarks in tmux
bind-key -r j run-shell "tmux neww open-jira"

# smart compose
# bind-key -r c-a run-shell "tmux neww smart-compose"
## Add a wait until keypress so I can see the outcome
bind-key -r c-a run-shell "tmux neww 'smart-compose; echo \"\n=== Press any key to close ===\"; read -n 1 -s -r'"

bind -n C-z resize-pane -Z

bind -n M-k send-keys C-k

# Reload tmux
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Quick find window
bind-key -r f run-shell "tmux neww tmux-sessionizer.sh"

# Quick find personal snippets
bind-key -r S run-shell "tmux neww '. tmux-snippets.sh && rusty-snippets'"

bind-key -r n run-shell "tmux-sessionizer.sh ~/files/docs/infor-vault"

# Create new window
bind-key c new-window -c '#{pane_current_path}'

# Bookmarks in tmux
bind-key -r b run-shell "tmux neww $HOME/.dotfiles/bin/.local/bin/nim_smart_lnks"

# Kill window with k
bind-key k confirm kill-window

# switch to last session
bind-key z switch-client -l

# Clear history with ctrl-k
bind-key k send-keys -R \; clear-history

bind-key h split-window -v -c '#{pane_current_path}'
bind-key v split-window -h -c '#{pane_current_path}'

# -- Status Bar ---------------------------------------------
set -g status-position bottom
set -g status-interval 1
set -g status-left "#{pane_title} #{?client_prefix,#[bg=red]PREFIX#[default],} "
set -g status-left-length 50
set -g status-right "#{cpu_percentage} #{ram_percentage} #{battery_graph} %H:%M"
set -g status-right-length 50

# -- Plugins -----------------------------------------------
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Theme
set -g @plugin 'odedlaz/tmux-onedark-theme'

# CPU Monitoring
set -g @plugin 'tmux-plugins/tmux-cpu'

# Battery Monitoring
set -g @plugin 'tmux-plugins/tmux-battery'

# Other plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'laktak/tome'
#tmux-jump <leader>+j to quickly move to place
set -g @plugin 'schasse/tmux-jump'
#extrakto <leader>+tab to quickly copy something 
set -g @plugin 'laktak/extrakto'


# Plugin sets

## 2026-04-02
# Tome setup, prefix-p or prefix-P
set -g @tome_key 'p'
set -g @tome_sctatch_key 'P'
set -g @tome_editor 'nvim'

# Continuum boot
set -g @continuum-boot 'on'
#set -g @continuum-boot-options 'iterm'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session' #for Neo Vim


